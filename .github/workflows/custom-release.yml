name: Custom Release

on:
  schedule:
    - cron: "17 1 * * *" # 09:17 UTC+8, once per day
  push:
    tags:
      - custom
      - "v*-custom.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  test:
    if: github.event_name == 'push' || github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      upstream: ${{ steps.version.outputs.upstream }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    env:
      SKIP_INTEROP_TEST: "1"
      SKIP_CONCURRENT_TEST: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'custom' }}
          fetch-depth: 0
          ssh-key: ${{ (github.event_name != 'push' || github.ref_name == 'custom') && secrets.CUSTOM_UPSTREAM_SSH_KEY || '' }}
          persist-credentials: ${{ github.event_name != 'push' || github.ref_name == 'custom' }}
      - name: Skip tags already built by upstream sync
        if: github.event_name == 'push'
        id: trigger
        run: |
          if [[ $(git cat-file -t "$GITHUB_REF") == tag && \
            $(git for-each-ref --format='%(contents:subject)' "$GITHUB_REF") == 'Custom Release run '* ]]; then
            echo 'This automatic tag is built by its originating run.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Merge latest upstream stable release
        if: github.event_name != 'push'
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')
          [[ "$upstream" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags https://github.com/MetaCubeX/mihomo.git \
            "refs/tags/$upstream:refs/tags/upstream/$upstream"
          if git merge-base --is-ancestor "upstream/$upstream" HEAD; then
            echo "Upstream $upstream is already merged."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "upstream/$upstream"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        if: steps.trigger.outputs.skip != 'true' && (github.event_name == 'push' || steps.sync.outputs.changed == 'true')
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"
      - name: Determine version
        if: steps.trigger.outputs.skip != 'true' && (github.event_name == 'push' || steps.sync.outputs.changed == 'true')
        id: version
        run: |
          git fetch --no-tags https://github.com/MetaCubeX/mihomo.git \
            'refs/tags/v*:refs/tags/upstream/v*'
          upstream=$(git describe --tags --match 'upstream/v[0-9]*' --exclude '*-*' --abbrev=0)
          upstream=${upstream#upstream/}
          [[ "$upstream" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(git rev-parse HEAD)
          revision=$GITHUB_RUN_NUMBER
          version="${upstream}-custom.${revision}"
          while git show-ref --verify --quiet "refs/tags/$version"; do
            [[ $(git rev-list -n 1 "$version") == "$commit" ]] && break
            revision=$((revision + 1))
            version="${upstream}-custom.${revision}"
          done
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != custom ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-custom\.[1-9][0-9]*$ ]]
            [[ "$GITHUB_REF_NAME" == "$upstream"-custom.* ]]
            version=$GITHUB_REF_NAME
          fi
          printf 'upstream=%s\nversion=%s\ncommit=%s\n' \
            "$upstream" "$version" "$commit" >> "$GITHUB_OUTPUT"
      - name: Test
        if: steps.trigger.outputs.skip != 'true' && (github.event_name == 'push' || steps.sync.outputs.changed == 'true')
        run: |
          go version
          go test ./...
          go test -tags with_gvisor ./...
      - name: Push tested merge and version tag
        if: steps.sync.outputs.changed == 'true' || (github.event_name == 'push' && github.ref_name == 'custom')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git show-ref --verify --quiet "refs/tags/$VERSION"; then
            git tag -a "$VERSION" -m "Custom Release run $GITHUB_RUN_ID"
          fi
          refs=("refs/tags/$VERSION")
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            refs=(HEAD:refs/heads/custom "${refs[@]}")
          fi
          if ! git push --atomic origin "${refs[@]}"; then
            echo '::error::Push failed. Check CUSTOM_UPSTREAM_SSH_KEY and its write-enabled deploy key, or rerun after a concurrent custom update.'
            exit 1
          fi

  build:
    needs: test
    if: needs.test.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
            extension: gz
          - target: windows-amd64
            runner: ubuntu-latest
            extension: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.test.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"
      - name: Build and sign macOS arm64
        if: matrix.target == 'darwin-arm64'
        run: sh scripts/build-custom-macos.sh
      - name: Build Windows amd64
        if: matrix.target == 'windows-amd64'
        run: |
          make windows-amd64-v1 NAME=mihomo VERSION="$VERSION" BINDIR=bin
          cd bin
          mv mihomo-windows-amd64-v1.exe mihomo-windows-amd64.exe
          zip -9 "mihomo-windows-amd64-${VERSION}.zip" mihomo-windows-amd64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: custom-${{ matrix.target }}
          path: bin/mihomo-${{ matrix.target }}-${{ env.VERSION }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UPSTREAM: ${{ needs.test.outputs.upstream }}
      VERSION: ${{ needs.test.outputs.version }}
      SOURCE_SHA: ${{ needs.test.outputs.commit }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: custom-*
          merge-multiple: true
          path: release
      - name: Publish release
        working-directory: release
        run: |
          tag="$VERSION"
          [[ $(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha') == "$SOURCE_SHA" ]]
          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$draft" == false ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            printf '%s\n' \
              "Upstream: MetaCubeX/mihomo ${UPSTREAM} (Meta)." \
              "Source commit: ${SOURCE_SHA}" \
              '' \
              'macOS arm64: ad-hoc signed executable (.gz).' \
              'Windows amd64: x86-64 v1 executable (.zip).' \
              'Both builds include with_gvisor and use MetaCubeX/go 1.26.' \
              > "$RUNNER_TEMP/custom-release-notes.txt"
            gh release create "$tag" --verify-tag --title "$VERSION" \
              --draft --notes-file "$RUNNER_TEMP/custom-release-notes.txt"
          fi
          printf '%s\n' "$VERSION" > version.txt
          sha256sum *.gz *.zip version.txt > SHA256SUMS
          gh release upload "$tag" *.gz *.zip version.txt SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --latest
